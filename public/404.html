<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page Not Found — Smart Tools Hub</title>
    <style>
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f8fafc;
        color: #0f172a;
        display: flex;
        min-height: 100vh;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }
      .card {
        max-width: 480px;
        width: 100%;
        background: #ffffff;
        border: 1px solid #e2e8f0;
        border-radius: 12px;
        padding: 32px;
        text-align: center;
      }
      .code {
        font-size: 48px;
        font-weight: 700;
        color: #2563eb;
        margin: 0 0 8px;
      }
      h1 {
        font-size: 22px;
        margin: 0 0 12px;
      }
      p {
        color: #64748b;
        line-height: 1.6;
        margin: 0 0 24px;
      }
      a {
        display: inline-block;
        background: #2563eb;
        color: #ffffff;
        text-decoration: none;
        padding: 10px 20px;
        border-radius: 8px;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="code">404</div>
      <h1>Page Not Found</h1>
      <p>The page you requested could not be located on Smart Tools Hub. Return to the homepage to browse all 10 tool categories.</p>
      <a href="./index.html">Back to Smart Tools Hub</a>
    </main>
  </body>
</html>
